[project]
name = "allun"
version = "0.1.0"
description = "Orquestrador de agentes de IA que se adapta ao hardware do usuário."
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "gpu-detector==1.0.0",
]

[project.optional-dependencies]
orquestrador = ["langgraph", "litellm"]
web = ["fastapi", "uvicorn[standard]"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
allun = "allun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allun"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

